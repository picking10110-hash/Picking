<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pedidos en tiempo y forma — ALAS</title>
  <meta name="description" content="Reporte de pedidos en tiempo y forma (OTIF) — ALAS Sistema Logístico" />
  <meta name="theme-color" content="#0B5F8D" />
  <link rel="icon" type="image/png" href="logo-alas-s.a.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Sora:wght@600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />

  <!-- Librerías (SheetJS se carga solo al subir un Excel) -->
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>

  <!-- Datos + motor -->
  <script src="supabase-config.js"></script>
  <script src="otif-calc.js"></script>
  <script src="otif-import.js"></script>
  <script src="otif-xlsx.js"></script>
  <script src="paraguay-mapa.js"></script>
  <script src="otif-geo.js"></script>

  <!-- Canónicos ALAS -->
  <script src="alas-transition.js"></script>
  <script src="alas-sso-config.js"></script>
  <script src="alas-auth-client.js"></script>
  <script src="ui-protection.js" defer></script>
</head>
<body>

  <!-- Loader de entrada (circular canónico del launcher) -->
  <div id="loader" class="loader" role="status" aria-label="Cargando">
    <div class="loader__stage">
      <svg class="loader__svg" width="272" height="272" viewBox="0 0 272 272" aria-hidden="true">
        <circle cx="136" cy="136" r="114" fill="none" stroke="rgba(11,95,141,.09)" stroke-width="1.5"/>
        <circle class="loader__arc" cx="136" cy="136" r="114" fill="none" stroke="#0B5F8D" stroke-width="2.5" stroke-linecap="round"/>
      </svg>
      <div class="loader__hub">
        <span class="loader__ring"></span>
        <span class="loader__surface"></span>
        <img src="logo-icon.png" alt="" class="loader__logo" draggable="false"/>
      </div>
    </div>
  </div>

  <div id="alas-root" class="layout">
    <div class="stage-shell">

      <aside class="sidebar">
        <div class="sidebar__logo"><img src="logo-icon.png" alt="ALAS" /></div>
        <nav class="sidebar__nav">
          <button class="nav-btn is-active" type="button" data-nav="resumen">
            <span class="nav-btn__ico"><svg fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg></span>
            <span class="nav-btn__lbl">Resumen</span>
          </button>
          <button class="nav-btn" type="button" data-nav="zonas">
            <span class="nav-btn__ico"><svg fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-7-6.2-7-11.5A7 7 0 0119 9.5C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg></span>
            <span class="nav-btn__lbl">Zonas</span>
          </button>
          <button class="nav-btn" type="button" data-nav="detalle">
            <span class="nav-btn__ico"><svg fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><path d="M14 2v6h6"/><path d="M8 13h8M8 17h6"/></svg></span>
            <span class="nav-btn__lbl">Detalle de pedidos</span>
          </button>
          <button class="nav-btn" type="button" data-nav="tiempos">
            <span class="nav-btn__ico"><svg fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24" stroke-linecap="round"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2M9 2h6"/></svg></span>
            <span class="nav-btn__lbl">Tiempos de entrega</span>
          </button>
          <button class="nav-btn" type="button" data-nav="vendedores">
            <span class="nav-btn__ico"><svg fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24" stroke-linecap="round"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 00-3-3.87M16 3.13a4 4 0 010 7.75"/></svg></span>
            <span class="nav-btn__lbl">Vendedores y clientes</span>
          </button>
          <button class="nav-btn" type="button" data-nav="parametros">
            <span class="nav-btn__ico"><svg fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24" stroke-linecap="round"><path d="M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M1 14h6M9 8h6M17 16h6"/></svg></span>
            <span class="nav-btn__lbl">Plazos y calendario</span>
          </button>
        </nav>
        <div class="sidebar__bottom">
          <button class="nav-btn nav-btn--upload" type="button" data-nav="cargar" id="navCargar">
            <span class="nav-btn__ico"><svg fill="none" stroke="currentColor" stroke-width="1.9" viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4M17 8l-5-5-5 5M12 3v12"/></svg></span>
            <span class="nav-btn__lbl">Actualizar datos</span>
          </button>
          <div class="sidebar__user" id="userChip" hidden>
            <span class="sidebar__user-ico"><svg fill="none" stroke="currentColor" stroke-width="1.9" viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg></span>
            <span class="sidebar__user-txt"><span id="userName">—</span><span class="sidebar__user-role" id="userRole"></span></span>
          </div>
          <button class="nav-btn nav-btn--back" type="button" id="btnBack" title="Volver al launcher">
            <span class="nav-btn__ico"><svg fill="none" stroke="currentColor" stroke-width="2.1" viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg></span>
            <span class="nav-btn__lbl">Menú</span>
          </button>
        </div>
      </aside>

      <main class="main">
        <div id="stage"></div>
      </main>

    </div>
  </div>

  <!-- Excel de SAP (solo admin) -->
  <input type="file" id="fileBase" accept=".xlsx,.xls" hidden />

  <script>
    if (window.ALASTransition) ALASTransition.init({ root: '#alas-root' });
    function alasGoToLauncher() {
      var url = (window.ALAS_SSO_CONFIG && ALAS_SSO_CONFIG.launcherUrl) || 'https://launcher-tawny.vercel.app';
      if (window.ALASTransition) ALASTransition.exitToLauncher(url); else window.location.href = url;
    }
    document.getElementById('btnBack').addEventListener('click', alasGoToLauncher);

    function alasReveal() {
      var l = document.getElementById('loader');
      if (l) l.classList.add('loader--hidden');
      var root = document.getElementById('alas-root');
      if (window.ALASTransition) ALASTransition.enterProject();
      if (root) { root.style.opacity = '1'; root.style.transform = 'none'; root.style.filter = 'none'; }
    }

    /* Boot: SSO real del Launcher. Sin sesión → vuelve al Launcher.
       Corre en DOMContentLoaded para que app.js (más abajo) ya esté cargado. */
    document.addEventListener('DOMContentLoaded', function () {
      var done = false;
      function sinSesion() {
        var url = (window.ALAS_SSO_CONFIG && ALAS_SSO_CONFIG.launcherUrl) || 'https://launcher-tawny.vercel.app';
        window.location.replace(url);
      }
      var failsafe = setTimeout(function () { if (!done) sinSesion(); }, 10000);
      (window.__alasAuthReady || Promise.resolve()).then(function () {
        var c = window.AlasAuthClient;
        if (!(c && c.isAuthenticated)) { clearTimeout(failsafe); sinSesion(); return; }
        done = true; clearTimeout(failsafe);
        document.getElementById('userName').textContent = c.getCurrentUser();
        var role = c.getRole && c.getRole();
        if (role) document.getElementById('userRole').textContent = role;
        document.getElementById('userChip').hidden = false;
        alasReveal();
        if (window.__initOtif) window.__initOtif();
      }).catch(function () { clearTimeout(failsafe); sinSesion(); });
    });
  </script>
  <script src="app.js"></script>
</body>
</html>
